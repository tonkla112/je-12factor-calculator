<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="0; url=compensation_dashboard.html">
<title>Opening HR Compensation System</title>
<style>
  :root {
    --navy: #16294d;
    --border: #dbe3ef;
    --muted: #64748b;
    --bg: #f6f8fb;
  }
  * { box-sizing: border-box; }
  body {
    min-height: 100vh;
    margin: 0;
    display: grid;
    place-items: center;
    background: var(--bg);
    color: #1f2937;
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
  }
  main {
    width: min(92vw, 520px);
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    box-shadow: 0 18px 50px rgba(22, 41, 77, .12);
  }
  h1 {
    margin: 0 0 8px;
    color: var(--navy);
    font-size: 20px;
  }
  p {
    margin: 0 0 18px;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.55;
  }
  a {
    display: inline-block;
    color: #fff;
    background: var(--navy);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 14px;
    font-weight: 700;
    text-decoration: none;
  }
</style>
</head>
<body>
<main>
  <h1>Opening HR Compensation System</h1>
  <p>This filename is kept as a shortcut. The compensation dashboard is now available as compensation_dashboard.html.</p>
  <a href="compensation_dashboard.html">Open the dashboard</a>
</main>
<script>
  window.location.replace('compensation_dashboard.html');
</script>
</body>
</html>
